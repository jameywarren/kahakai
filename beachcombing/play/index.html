/* Layout: one full-screen scene. A headphone mark invites the first tap; a faint mark in the corner opens the card (sound, what this is, the way home). */
:root {
  --night: #17132b;

}
html, body { height: 100%; }

  position: fixed; left: 50%; top: 30%; width: 96px; height: 96px; margin: -48px 0 0 -48px; padding: 14px; box-sizing: border-box;

  color: var(--ink); pointer-events: none;
  filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 2px 6px rgba(23, 19, 43, .6));
  animation: breathe 3.6s ease-in-out infinite; transition: opacity 1.6s ease;
}
#ears.gone { opacity: 0; animation: none; }
@keyframes breathe { 0%, 100% { opacity: .5; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { #ears { animation: none; opacity: .9; } }

/* prototype controls: a faint gear, and a panel behind it. Not part of the experience. */
#gear {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 244, 230, .22); background: rgba(23, 19, 43, .38);
  color: var(--ink); opacity: .45; cursor: pointer; display: grid; place-items: center; padding: 0;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#gear:hover, #gear[aria-expanded="true"] { opacity: 1; }
#gear:focus-visible, #panel button:focus-visible, #panel select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#panel {
  position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: min(260px, calc(100vw - 24px)); padding: 14px; border-radius: 14px; display: grid; gap: 12px;

}

}

    for (const r of rips) { const k = (now - r.t0) / 2.6, [x, y] = PT(r.px, r.py); c.lineWidth = 1.2; for (let j = 0; j < 2; j++) { const kk = k - j * .22; if (kk <= 0) continue; c.strokeStyle = `rgba(255,244,230,${.5 * (1 - kk) * (1 - kk)})`; c.beginPath(); c.ellipse(x, y, u * (.012 + kk * .06), u * (.003 + kk * .012), 0, 0, 7); c.stroke(); } }
    for (const f of flecks) { const k = (now - f.t0) / 1.3; if (k <= 0) continue; const [x, y] = PT(f.px + f.vx * k, f.py + .09 * k * k + .01 * k), r = Math.max(2, u * .006) * f.r; c.save(); c.translate(x, y); c.rotate(f.sp * k); c.fillStyle = sil(.85 * (1 - k * k)); c.beginPath(); c.ellipse(0, 0, r * 1.8, r * .45, 0, 0, 7); c.fill(); c.restore(); }
    // the green flash
    { const k = (now - flashAt) / 1.9; if (k > 0 && k < 1) { const [ux] = sunAt(), a = Math.pow(Math.sin(Math.PI * k), .7), r = Math.max(11, u * .028); c.save(); c.translate(ux, hy - 1); c.scale(1, .5);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, `rgba(215,255,215,${a})`); g.addColorStop(.18, `rgba(110,255,150,${.9 * a})`); g.addColorStop(.5, `rgba(40,230,120,${.4 * a})`); g.addColorStop(1, 'rgba(30,210,110,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, Math.PI, 0); c.fill(); c.restore(); } }
    // a shooting star
    if (star) { const k = (now - star.t0) / .8; if (k > 0 && k < 1) { const n = Math.hypot(star.dx, star.dy), vx = star.dx / n, vy = star.dy / n, hx = star.x + vx * star.len * k, hy2 = star.y + vy * star.len * k, tl = star.len * .45 * Math.sin(Math.PI * k);
      const g = c.createLinearGradient(hx, hy2, hx - vx * tl, hy2 - vy * tl); g.addColorStop(0, `rgba(255,252,240,${.95 * Math.sin(Math.PI * k)})`); g.addColorStop(1, 'rgba(255,252,240,0)'); c.save(); c.strokeStyle = g; c.lineWidth = 1.6; c.lineCap = 'round'; c.beginPath(); c.moveTo(hx, hy2); c.lineTo(hx - vx * tl, hy2 - vy * tl); c.stroke(); c.restore(); } }
    // a whale breathing, far out
    for (const sp of spouts) { const k = (now - sp.t0) / 3.2; if (k <= 0 || k >= 1) continue; const [x, y] = PT(sp.px, HFR + .0035), h = Math.max(7, u * .017), up = Math.min(1, k * 3), a = Math.sin(Math.PI * Math.min(1, k * 1.15)) * (.6 - .35 * dusk);
      c.fillStyle = sil(.55 * Math.sin(Math.PI * k)); c.beginPath(); c.ellipse(x - h * .3, y + 1, h * .75, h * .09, 0, Math.PI, 0); c.fill();
      for (let j = 0; j < 5; j++) { const q = j / 4, r = h * (.1 + .16 * q) * (.7 + k * .8); c.fillStyle = `rgba(255,248,238,${a * (1 - q * .55)})`; c.beginPath(); c.arc(x + k * h * .5 * q, y - h * q * up, r, 0, 7); c.fill(); } }
    // a navigation light far out: one small white point that comes on at dusk and flashes on its own slow count
    if (B.light && dusk > .55) { const [x, y] = PT(B.light[0], B.light[1]), ph = (now % 4) / 4, on = ph < .12 ? 1 : .0, a = clamp((dusk - .55) / .2, 0, 1) * on;
      if (a > 0) { const g = c.createRadialGradient(x, y, 0, x, y, 7); g.addColorStop(0, `rgba(255,252,235,${a})`); g.addColorStop(.25, `rgba(255,250,225,${.5 * a})`); g.addColorStop(1, 'rgba(255,250,225,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 7, 0, 7); c.fill(); } }
    // the Milky Way: only where the sky is this dark, and only on nights when the real moon is thin
    if (B.milky && dusk > .8 && moonFull() < .35) { const a = clamp((dusk - .8) / .2, 0, 1) * (1 - moonFull() / .35); c.globalAlpha = a; c.drawImage(milkyPic(), offX, offY, D, D * HFR); c.globalAlpha = 1; }
    drawRockCrabs();
    // the crab and its hole
    if (crab) {
      const cb = crab, [x, y] = crabPos(), hx = offX + cb.hu * D, hy3 = ysAt(hx) + sandH() * cb.hd, s = scaleAt(y), r = Math.max(4.5, u * .0105) * s;
      const grow = cb.phase === 'out' ? clamp(1 - (cb.until - now) / .7, 0, 1) : cb.phase === 'in' ? clamp((cb.until - now) / .35, 0, 1) : 1;
      c.fillStyle = sil(.55); c.beginPath(); c.ellipse(hx, hy3, r * .9, r * .36, 0, 0, 7); c.fill();
      const mix = (a, b) => Math.round(a + (b - a) * dusk), body = `rgb(${mix(232, 96)},${mix(204, 104)},${mix(168, 140)})`, dark = `rgba(${mix(120, 30)},${mix(84, 30)},${mix(60, 60)},.9)`;
      c.save(); c.translate(x, y - r * .3 * grow); c.scale(grow, grow * .8);
      c.fillStyle = sil(.3); c.beginPath(); c.ellipse(r * .2, r * .75, r * 1.5, r * .32, 0, 0, 7); c.fill();
      c.strokeStyle = body; c.lineWidth = Math.max(1, r * .2); c.lineCap = 'round';
      for (const sd of [-1, 1]) for (let j = 0; j < 4; j++) { const ph = Math.sin(cb.leg + j * 1.7 + (sd > 0 ? 1.1 : 0)) * .35, a0 = (-.5 + j * .36) + ph * .5; c.beginPath(); c.moveTo(sd * r * .75, a0 * r * .5); c.lineTo(sd * r * 1.45, a0 * r * 1.1 + r * .1); c.lineTo(sd * r * 1.8, a0 * r * 1.3 + r * .55); c.stroke(); }
      c.fillStyle = body; c.beginPath(); c.ellipse(0, 0, r, r * .68, 0, 0, 7); c.fill();
      c.beginPath(); c.ellipse(-r * .95, -r * .55, r * .34, r * .24, -.6, 0, 7); c.ellipse(r * .95, -r * .55, r * .42, r * .28, .6, 0, 7); c.fill();
      c.strokeStyle = dark; c.lineWidth = Math.max(.8, r * .13); c.beginPath(); c.moveTo(-r * .3, -r * .5); c.lineTo(-r * .34, -r * 1.15); c.moveTo(r * .3, -r * .5); c.lineTo(r * .34, -r * 1.15); c.stroke();
      c.fillStyle = dark; c.beginPath(); c.arc(-r * .34, -r * 1.2, r * .15, 0, 7); c.arc(r * .34, -r * 1.2, r * .15, 0, 7); c.fill();
      c.restore();
    }
  }

  // ---------- the card ----------
  {
    const menu = document.getElementById('menu'), wrap = document.getElementById('cardwrap'), sb = document.getElementById('c-snd');
    document.documentElement.lang = LANG;
    for (const k of ['sound', 'line', 'how']) document.getElementById('c-' + k).textContent = T9[k];
        const live = () => soundOn && !!audio;
    const show = () => { document.getElementById('c-state').textContent = live() ? T9.on : T9.off; sb.setAttribute('aria-pressed', String(live())); };
    const places = document.getElementById('c-places'), placeEl = document.getElementById('c-place');
    const marks = () => { placeEl.textContent = B.name; placeEl.hidden = PLACES.length > 1; places.hidden = PLACES.length < 2; for (const b of places.children) b.setAttribute('aria-current', String(b.dataset.k === cur)); document.getElementById('top').setAttribute('aria-label', B.name + '. ' + LABEL); };
    const LABEL = document.getElementById('top').getAttribute('aria-label').replace(/^[^.]*\. /, '');
    for (const k of PLACES) { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = BEACHES[k].name; b.addEventListener('click', () => { if (k !== cur) { setBeach(k); setTimeout(marks, 800); } open(false); }); places.appendChild(b); }
    marks();
    const open = on => { wrap.hidden = !on; menu.setAttribute('aria-expanded', String(on)); show(); marks(); };
    menu.addEventListener('click', () => { startAudio(); open(wrap.hidden); });
    wrap.addEventListener('click', e => { if (e.target === wrap) open(false); });
    sb.addEventListener('click', () => { if (audio) toggleSound(); setTimeout(show, 60); });
    addEventListener('keydown', e => { if (e.key === 'Escape') { open(false); shelfEl.hidden = true; closeNote(); } });
  }

  // ---------- loop ----------
  // visit: the seconds this beach has actually been watched (time with the page away does not count)
  let last = 0, slow = .016, frames = 0, visit = 0; const duskBias = /dusk/.test(HASH) ? .9 : 0; let duskStep = null, sunTap = -9;
  const sunAt = () => B.sun ? [offX + B.sun[0] * D, offY + B.sun[1] * D] : [-999, -999];
  function frame(ms) {
    const now = ms / 1000, raw = Math.min(1.5, now - last || .016), dt = Math.min(.05, raw); last = now;
    if (cv.clientWidth !== W || cv.clientHeight !== H) {
      // keep footprints where they were in the picture when the screen turns or resizes
      const first = !W, kept = prints.map(p => [(p.x - offX) / D, (p.y - offY) / D]);
      resize();
      prints.forEach((p, i) => { p.x = offX + kept[i][0] * D; p.y = offY + kept[i][1] * D; });
      if (first) trail(now, false);
    }
    visit += raw;
    const want = duskStep === null ? clamp(visit / (14 * 60) + duskBias, 0, 1) : duskStep;
    dusk += (want - dusk) * Math.min(1, raw * .9);
    slow = slow * .95 + dt * .05; if (++frames > 90 && slow > .04 && GLS > 1) { GLS = Math.max(1, GLS - .25); glc.width = Math.round(W * GLS); glc.height = Math.round(H * GLS); frames = 0; }
    ebb = clamp((visit - 20 * 60 / (PACE < 1 ? 8 : 1)) / (4 * 60 / (PACE < 1 ? 8 : 1)), 0, 1);
    makeWaves(now); computeEdge(now, dt); updatePrints(now);
    c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
    paint(now);
    if (!plateReady) { requestAnimationFrame(frame); return; }
    updateFind(now, dt); updateWorld(now, dt); drawShoreExtras(now); drawPrints(now); drawWorld(now); drawFinds(now);
    { const rg = now - sunTap; if (rg >= 0 && rg < 1.4) { const [ux, uy] = sunAt(); c.strokeStyle = `rgba(255,236,200,${.6 * (1 - rg / 1.4)})`; c.lineWidth = 2; c.beginPath(); c.arc(ux, uy, 14 + rg * 60, 0, 7); c.stroke(); } }
    if (audio && audio.ctx.state === 'running') ears.classList.add('gone');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
